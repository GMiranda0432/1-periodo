<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Notas da turma</title>
</head>

<body>
    <h1>Notas da turma</h1>
    <h2>Digite as notas na caixa abaixo e clique em "adicionar", depois use o "ver média" para ver a média de todas as notas registradas</h2>
    <h3>
        <input type="number" id="InNotas" placeholder="Nota:">
        <button id="btAdicionar">Adicionar</button>
        <button id="btMedia">Ver média</button>
    </h3>
    <ul id="listaNotas"></ul>
    <h3 id="Media"></h3>
    <script src="notasVetor.js"></script>
</body>

</html>
