<!DOCTYPE html>
<html lang="pt-BR">
<!-- bruh-->
<head>
    <meta charset="UTF-8">
    <title>CRUD de Contatos</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">
        <h1> Meus Contatos</h1>

        <form id="formContato">
            <input type="hidden" id="inputId">
            <input type="text" id="inputNome" placeholder="Nome" required>
            <input type="tel" id="inputTelefone" placeholder="Telefone" required>
            <input type="email" id="inputEmail" placeholder="E-mail" required>
            <div class="botoes-form">
                <button type="submit" id="btnSalvar">Adicionar</button>
                <button type="button" id="btnCancelar" class="oculto">Cancelar</button>
            </div>
        </form>

        <div id="listaContatos"></div>
    </div>
    <script src="app.js"></script>
</body>

</html>
